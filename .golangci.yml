version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nakedret
    - nestif
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocritic:
      disabled-checks:
        - captLocal
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
    nolintlint:
      allow-unused: false
    misspell:
      locale: US
      # rest.Creater is the upstream k8s.io/apiserver interface name.
      ignore-rules:
        - creater
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 30
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 5
  exclusions:
    generated: strict
    paths:
      - vendor
      - dist
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - goconst
          - gocyclo
          - nestif
      # Table-driven subtests re-declare err per case; the outer one is fixture setup.
      - path: _test\.go
        linters:
          - govet
        text: "shadow"

      # Every int32 conversion here narrows a Kubernetes replica/pool count, a slice
      # length, or an HTTP status code — none can reach 2^31.
      - linters: [gosec]
        text: "G115"
      # OpenAPI schema names and e2b request keys read worse behind an identifier
      # than as the literal they are.
      - linters: [goconst]
        text: "string `(kind|object|apiVersion|timeout)`"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cocoonstack/
