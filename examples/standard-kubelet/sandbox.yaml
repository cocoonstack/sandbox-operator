# A Sandbox on an ordinary kubelet node. Isolation comes from the cluster's
# RuntimeClass (Kata Containers, gVisor); no cocoon component is involved.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: standard-kubelet-example
spec:
  podTemplate:
    spec:
      runtimeClassName: kata
      containers:
        - name: agent
          image: ghcr.io/cocoonstack/sandbox/agent:latest
  service: true
  shutdownPolicy: Delete
