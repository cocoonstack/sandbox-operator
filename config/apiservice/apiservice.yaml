# L3 aggregated apiserver registration for sandboxes.agents.x-k8s.io.
#
# This is the metrics.k8s.io-style APIService: it hands the whole
# agents.x-k8s.io/v1beta1 group-version to the aggregated sandbox-apiserver,
# which serves `sandboxes` by scatter-gathering per-node NodeInventory rather
# than reading per-sandbox objects from etcd. That group-version contains only
# the `sandboxes` resource: the SandboxClaim/SandboxTemplate/SandboxWarmPool
# CRDs live in upstream's separate `extensions.agents.x-k8s.io` group and the
# NodeInventory CRD the scatter-gather reads from in `sandbox.cocoonstack.io`,
# neither of which this APIService touches. (NodeInventory deliberately does
# NOT share the aggregated group: the
# aggregated server serves only `sandboxes`, so anything else registered under
# agents.x-k8s.io/v1beta1 would 404 once this APIService is applied.)
#
# Ordering caveat: an APIService takes precedence over a CRD for the same
# group-version, so once this is applied the aggregated server owns
# agents.x-k8s.io/v1beta1 `sandboxes`. The Sandbox CRD for this group-version
# should therefore NOT also be installed (aggregation replaces it), exactly as
# metrics.k8s.io replaces any CRD for its group.
#
# TLS: cert-manager injects the CA of the serving certificate
# (config/apiserver/certificate.yaml) into spec.caBundle via the
# inject-ca-from annotation, so the kube-apiserver verifies the aggregated
# server's certificate — no TLS-verify escape hatch. The backing Service and
# the Deployment it selects live in config/apiserver/.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.agents.x-k8s.io
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
  annotations:
    cert-manager.io/inject-ca-from: sandbox-system/sandbox-apiserver-serving
spec:
  group: agents.x-k8s.io
  version: v1beta1
  service:
    name: sandbox-apiserver
    namespace: sandbox-system
    port: 443
  groupPriorityMinimum: 1000
  versionPriority: 15
