# envd-proxy workload (cmd/envd-proxy, built via Dockerfile.envdproxy /
# `make envdproxy-image`). See docs/envd-proxy.md.
#
# It is the data-plane entry point of the e2b-compatible surface and runs off
# the compute nodes on purpose: no client learns a node address, and a node's
# sandboxd stays the only thing holding sandboxes. It is stateless — sandbox
# lookups are served from a NodeInventory informer — so replicas scale with
# client fan-out, not with sandbox count.
#
# --domain MUST match the apiserver's --e2b-domain: both spell a sandbox host
# as {port}-{sandboxID}.{domain}, and wildcard DNS for *.{domain} must resolve
# to this Service.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envd-proxy
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: envd-proxy
    app.kubernetes.io/component: data-plane-proxy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envd-proxy
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: envd-proxy
    app.kubernetes.io/component: data-plane-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: envd-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envd-proxy
        app.kubernetes.io/component: data-plane-proxy
    spec:
      serviceAccountName: envd-proxy
      # Every sandbox's files/commands/pty traffic crosses these pods, so both
      # replicas on one node turn a single drain into a fleet-wide data-plane
      # outage.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envd-proxy
      containers:
      - name: envd-proxy
        image: ko://github.com/cocoonstack/sandbox-operator/cmd/envd-proxy # placeholder value, replaced by deployment scripts
        args:
        - --bind-address=:8443
        - --domain=sandbox.example.com
        - --namespace=default
        - --tls-cert-file=/etc/envd-proxy/serving-certs/tls.crt
        - --tls-private-key-file=/etc/envd-proxy/serving-certs/tls.key
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: serving-certs
          mountPath: /etc/envd-proxy/serving-certs
          readOnly: true
      volumes:
      - name: serving-certs
        secret:
          # A wildcard certificate for *.{domain}: the SDK addresses every
          # sandbox by its own derived host.
          secretName: envd-proxy-serving-certs

---
apiVersion: v1
kind: Service
metadata:
  name: envd-proxy
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: envd-proxy
    app.kubernetes.io/component: data-plane-proxy
spec:
  selector:
    app.kubernetes.io/name: envd-proxy
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
