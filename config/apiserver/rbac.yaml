# RBAC for the aggregated sandbox-apiserver, least privilege:
#
#   1. system:auth-delegator — lets the server delegate authentication
#      (TokenReview) and authorization (SubjectAccessReview) to the host
#      kube-apiserver, as every aggregated apiserver does.
#   2. extension-apiserver-authentication-reader — read access to the
#      kube-system/extension-apiserver-authentication ConfigMap (client-CA and
#      requestheader config for delegated authn).
#   3. nodeinventories read — get/list/watch on the O(nodes) NodeInventory
#      objects (sandbox.cocoonstack.io) the scatter-gather store is fed
#      from. The server reads nothing else and writes nothing.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-apiserver:system:auth-delegator
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
subjects:
- kind: ServiceAccount
  name: sandbox-apiserver
  namespace: sandbox-system
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-apiserver-auth-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
subjects:
- kind: ServiceAccount
  name: sandbox-apiserver
  namespace: sandbox-system
roleRef:
  kind: Role
  name: extension-apiserver-authentication-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-apiserver-inventory-reader
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
rules:
- apiGroups:
  - sandbox.cocoonstack.io
  resources:
  - nodeinventories
  verbs:
  - get
  - list
  - watch
# The in-process SandboxWarmPool driver reads pools + templates and writes pool
# status back from live inventory (control-plane warm-capacity surface).
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxwarmpools
  - sandboxtemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxwarmpools/status
  verbs:
  - get
  - update
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-apiserver-inventory-reader
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
subjects:
- kind: ServiceAccount
  name: sandbox-apiserver
  namespace: sandbox-system
roleRef:
  kind: ClusterRole
  name: sandbox-apiserver-inventory-reader
  apiGroup: rbac.authorization.k8s.io

---
# Leader election for the in-process SandboxWarmPool driver: exactly one of the
# apiserver replicas drives the pools. The lease + events live in the apiserver's
# own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-apiserver-leader-election
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-apiserver-leader-election
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
subjects:
- kind: ServiceAccount
  name: sandbox-apiserver
  namespace: sandbox-system
roleRef:
  kind: Role
  name: sandbox-apiserver-leader-election
  apiGroup: rbac.authorization.k8s.io
