version: 2

before:
  hooks:
    - go mod download

builds:
  - id: sandbox-apiserver-linux
    binary: sandbox-apiserver
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/cocoonstack/sandbox-operator/version.REVISION={{.Commit}}
      - -X github.com/cocoonstack/sandbox-operator/version.VERSION={{.Env.VERSION}}
      - -X github.com/cocoonstack/sandbox-operator/version.BUILTAT={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/sandbox-apiserver

  - id: sandbox-envd-proxy-linux
    binary: sandbox-envd-proxy
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/cocoonstack/sandbox-operator/version.REVISION={{.Commit}}
      - -X github.com/cocoonstack/sandbox-operator/version.VERSION={{.Env.VERSION}}
      - -X github.com/cocoonstack/sandbox-operator/version.BUILTAT={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/sandbox-envd-proxy

archives:
  - id: apiserver
    ids:
      - sandbox-apiserver-linux
    name_template: >-
      sandbox-apiserver_{{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

  # Unversioned aliases so releases/latest/download/<name>_Linux_x86_64 resolves.
  - id: apiserver-latest
    ids:
      - sandbox-apiserver-linux
    name_template: >-
      sandbox-apiserver_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

  - id: envd-proxy
    ids:
      - sandbox-envd-proxy-linux
    name_template: >-
      sandbox-envd-proxy_{{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

  - id: envd-proxy-latest
    ids:
      - sandbox-envd-proxy-linux
    name_template: >-
      sandbox-envd-proxy_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

checksum:
  name_template: 'checksums.txt'

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
