# sandbox-sdk-loadgen: persistent-client Create(Sandbox) latency benchmark.
# Ships at replicas 0 — scale to 1 to start a run:
#   kubectl -n sandbox-sdk-loadgen scale deploy/sandbox-sdk-loadgen --replicas=1
#
# SAFETY: --total is REQUIRED by the binary (it refuses to start without it) and
# the run issues EXACTLY that many creates, then stops. --cleanup=true makes each
# worker block until its sandbox's release is confirmed, so live claims never
# exceed --concurrency. Set the numbers below to the run you were asked for —
# never scale this up "to see what happens".
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-sdk-loadgen
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
# Add imagePullSecrets here if you host the loadgen image in a private registry.
---
# CRUD on the aggregated sandboxes resource. This is the ONLY object the loadgen
# touches; it never reads NodeInventory or any desktop/CocoonSet resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-sdk-loadgen
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-sdk-loadgen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-sdk-loadgen
subjects:
- kind: ServiceAccount
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
  labels:
    app: sandbox-sdk-loadgen
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sandbox-sdk-loadgen
  template:
    metadata:
      labels:
        app: sandbox-sdk-loadgen
    spec:
      serviceAccountName: sandbox-sdk-loadgen
      containers:
      - name: loadgen
        # Build with `docker build --build-arg BINARY=sandbox-sdk-loadgen -t <registry>/sandbox-sdk-loadgen:<tag> .` and push it.
        image: ghcr.io/cocoonstack/sandbox-sdk-loadgen:latest
        args:
        - --namespace=sandbox-sdk-loadgen
        - --concurrency=2
        - --total=10
        - --cleanup=true
        - --metrics-addr=:9090
        ports:
        - name: metrics
          containerPort: 9090
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
  labels:
    app: sandbox-sdk-loadgen
spec:
  selector:
    app: sandbox-sdk-loadgen
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
