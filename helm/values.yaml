apiserver:
  image:
    repository: ghcr.io/cocoonstack/sandbox-apiserver
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  securePort: 6443
  # warmPoolDriver runs the in-process SandboxWarmPool reconcile loop; it needs
  # the pool RBAC and the leader-election lease this chart installs with it.
  warmPoolDriver: true
  # sandboxdToken names a Secret holding the fleet-wide sandboxd api_token.
  # Without it node-local calls carry no token, and a node that requires one refuses them.
  sandboxdToken:
    secretName: ""
    key: token
  e2b:
    enabled: false
    # domain is required once enabled: a sandbox host is
    # {port}-{sandboxID}.{domain} and the proxy follows this value.
    domain: ""
    namespace: default
    # envdVersion must name the envd installed in the pool image; the SDK
    # version-compares it and kills the sandbox when it cannot parse one.
    envdVersion: ""
    defaultTimeoutSeconds: 0
    port: 8080
    # apiKeySecret holds the accepted X-API-KEY values, one per line as "key"
    # or "key namespace" (a key sees only its namespace's sandboxes). Required
    # once enabled: the surface refuses to serve unauthenticated.
    apiKeySecret:
      name: ""
      key: keys
    # templateAliases maps a templateID the SDK sends onto a pool image and
    # size, one per line as "alias pool-image [size]" (size defaults to small).
    # Sandbox.create() with no template asks for base, and the code-interpreter
    # SDK for code-interpreter-v1, so name them here for that call to work.
    templateAliases: ""
    # envdSecret keys every sandbox's envd access token, which this surface
    # hands the SDK and the envd-proxy verifies. Required once enabled: set
    # value and the chart renders the Secret, or name an existing one.
    envdSecret:
      value: ""
      secretName: ""
      key: secret
    # builds serves Template.build. A build lives in the replica that took it,
    # so the Service pins each client to one replica while builds are on.
    builds:
      enabled: false
      parallel: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# envdProxy renders only with apiserver.e2b.enabled: it is that surface's data plane.
envdProxy:
  image:
    repository: ghcr.io/cocoonstack/sandbox-envd-proxy
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  # domain defaults to apiserver.e2b.domain: the proxy resolves the sandboxes
  # that surface claims, under the same host scheme. namespace narrows its
  # inventory lookups; empty resolves across every namespace, which keyed
  # namespaces need.
  domain: ""
  namespace: ""
  port: 8443
  # tlsSecretName holds a wildcard certificate for *.{domain}. Empty serves
  # cleartext h2c behind an edge that already terminated TLS.
  tlsSecretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

certManager:
  enabled: true
  servingCertSecret: sandbox-apiserver-serving-certs
  # caBundle is the base64 PEM CA of servingCertSecret, required when
  # cert-manager is disabled: the kube-apiserver verifies the aggregated server.
  caBundle: ""
