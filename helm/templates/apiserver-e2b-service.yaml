{{- if .Values.apiserver.e2b.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sandbox-apiserver-e2b
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox-operator.apiserver.labels" . | nindent 4 }}
spec:
  {{- if .Values.apiserver.e2b.builds.enabled }}
  sessionAffinity: ClientIP
  {{- end }}
  selector:
    {{- include "sandbox-operator.apiserver.selectorLabels" . | nindent 4 }}
  ports:
  - name: e2b
    port: 80
    targetPort: e2b
    protocol: TCP
{{- end }}
