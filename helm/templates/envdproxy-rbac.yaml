{{- if .Values.apiserver.e2b.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-envd-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox-operator.envdProxy.labels" . | nindent 4 }}

---
# Least privilege: the proxy only resolves a sandbox's owning node. The
# per-sandbox credential travels with the client request, so it holds no cluster
# authority over sandboxes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-envd-proxy-inventory-reader
  labels:
    {{- include "sandbox-operator.envdProxy.labels" . | nindent 4 }}
rules:
- apiGroups: ["sandbox.cocoonstack.io"]
  resources: ["nodeinventories"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-envd-proxy-inventory-reader
  labels:
    {{- include "sandbox-operator.envdProxy.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: sandbox-envd-proxy
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: sandbox-envd-proxy-inventory-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
